server {
    listen 0.0.0.0:8080;
    server_name example.local;
    client_max_body_size 10M;
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allow_methods GET POST;
        root /workspace/test_docker/www/html;
        index index.html default.html;
        autoindex off;
    }

    location /assets {
        allow_methods GET;
        root /workspace/test_docker/www;
        autoindex on;
    }

    location /old-page {
        return 301 /new-page;
    }

    location /upload {
        allow_methods POST GET DELETE;
        root /workspace/test_docker/www;
        upload_enable on;
        upload_store /workspace/test_docker/www/upload/temp;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root /workspace/test_docker/www/cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }
}

server {
    listen 0.0.0.0:9090;
    server_name second-app.local;
    client_max_body_size 1M;

    location / {
        allow_methods GET;
        root /workspace/test_docker/www/second_app;
        index home.html;
    }
}
