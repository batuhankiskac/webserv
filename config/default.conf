# Default webserv configuration (used when ./webserv is started without arguments).
# Paths are relative to the repository root, so run the server from there.
# A location's root replaces the location prefix:
#   location /assets + root ./website/assets  =>  /assets/test.txt -> ./website/assets/test.txt

server {
    listen 127.0.0.1:8080;
    server_name localhost;
    client_max_body_size 10M;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allow_methods GET;
        root ./website;
        index index.html;
        autoindex off;
    }

    location /assets {
        allow_methods GET;
        root ./website/assets;
        autoindex off;
    }

    location /autoindex {
        allow_methods GET;
        root ./website/autoindex;
        autoindex on;
    }

    location /index-fallback {
        allow_methods GET;
        root ./website/index-fallback;
        index missing.html fallback.html;
    }

    location /get-only {
        allow_methods GET;
        root ./website/get-only;
        index page.html;
    }

    location /nested {
        allow_methods GET;
        root ./website/nested;
    }

    location /nested/deeper {
        allow_methods GET DELETE;
        root ./website/nested/deeper;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root ./website/upload;
        upload_enable on;
        upload_store ./website/upload;
        autoindex on;
        client_max_body_size 10M;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root ./website/cgi-bin;
        cgi_ext .py;
        cgi_path /usr/bin/python3;
    }

    location /cgi-pl {
        allow_methods GET POST;
        root ./website/cgi-pl;
        cgi_ext .pl;
        cgi_path /usr/bin/perl;
    }

    location /redirect-301 {
        return 301 /;
    }
}

server {
    listen 127.0.0.1:9090;
    client_max_body_size 1M;

    error_page 404 /errors/404.html;

    location / {
        allow_methods GET;
        root ./website/secondary;
        index index.html;
    }
}
