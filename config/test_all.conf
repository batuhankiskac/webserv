# Comprehensive test configuration for webserv
# Tests all features: GET, POST, DELETE, CGI, redirect, autoindex, error pages, 
# client_max_body_size, method restrictions, virtual hosts, upload, etc.

server {
    # Main test server on port 8080
    listen 127.0.0.1:8080;
    server_name localhost test.local;
    client_max_body_size 10M;

    # Custom error pages
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # ============================
    # Root location - serves main website
    # ============================
    location / {
        allow_methods GET;
        root /Users/batuhankiskac/Desktop/webserv/website;
        index index.html;
        autoindex off;
    }

    # ============================
    # Static assets (CSS, JS, images)
    # ============================
    location /assets {
        allow_methods GET;
        root /Users/batuhankiskac/Desktop/webserv/website;
        autoindex off;
    }

    # ============================
    # Autoindex directory listing
    # ============================
    location /autoindex {
        allow_methods GET;
        root /Users/batuhankiskac/Desktop/webserv/website;
        autoindex on;
    }

    # ============================
    # GET-only location (405 on POST/DELETE)
    # ============================
    location /get-only {
        allow_methods GET;
        root /Users/batuhankiskac/Desktop/webserv/website;
        index page.html;
        autoindex off;
    }

    # ============================
    # Upload location - POST, GET, DELETE
    # ============================
    location /upload {
        allow_methods GET POST DELETE;
        root /Users/batuhankiskac/Desktop/webserv/website;
        upload_enable on;
        upload_store /Users/batuhankiskac/Desktop/webserv/website/upload;
        autoindex on;
    }

    # ============================
    # Small upload limit test (1KB)
    # ============================
    location /small-upload {
        allow_methods GET POST;
        root /Users/batuhankiskac/Desktop/webserv/website;
        upload_enable on;
        upload_store /Users/batuhankiskac/Desktop/webserv/website/small-upload;
        autoindex on;
        client_max_body_size 1K;
    }

    # ============================
    # CGI location - PHP
    # ============================
    location /cgi-bin {
        allow_methods GET POST;
        root /Users/batuhankiskac/Desktop/webserv/website;
        cgi_ext .php;
        cgi_path /usr/bin/php-cgi;
    }

    # ============================
    # Redirect test (301)
    # ============================
    location /redirect-me {
        return 301 /;
    }
}

# ============================
# Second server for virtual host testing (port 9090)
# ============================
server {
    listen 127.0.0.1:9090;
    server_name second.local;
    client_max_body_size 5M;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allow_methods GET POST;
        root /Users/batuhankiskac/Desktop/webserv/website;
        index index.html;
        autoindex off;
    }
}