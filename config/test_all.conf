# Comprehensive integration-test configuration.
# test/test.sh replaces __TEST_SITE__ and __PYTHON_CGI_PATH__ with isolated test values.

server {
    listen 127.0.0.1:8080;
    server_name localhost main.local;
    client_max_body_size 64K;

    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    location / {
        allow_methods GET;
        root __TEST_SITE__;
        index index.html fallback.html;
        autoindex off;
    }

    location /assets {
        allow_methods GET;
        root __TEST_SITE__;
        autoindex off;
    }

    location /autoindex {
        allow_methods GET;
        root __TEST_SITE__;
        autoindex on;
    }

    location /no-autoindex {
        allow_methods GET;
        root __TEST_SITE__;
        autoindex off;
    }

    location /index-fallback {
        allow_methods GET;
        root __TEST_SITE__;
        index missing.html fallback.html;
        autoindex off;
    }

    location /get-only {
        allow_methods GET;
        root __TEST_SITE__;
        index page.html;
        autoindex off;
    }

    location /post-disabled {
        allow_methods POST;
        root __TEST_SITE__;
        upload_enable off;
    }

    location /upload-no-store {
        allow_methods POST;
        root __TEST_SITE__;
        upload_enable on;
    }

    location /upload {
        allow_methods GET POST DELETE;
        root __TEST_SITE__;
        upload_enable on;
        upload_store __TEST_SITE__/upload;
        autoindex on;
    }

    location /small-upload {
        allow_methods GET POST;
        root __TEST_SITE__;
        upload_enable on;
        upload_store __TEST_SITE__/small-upload;
        autoindex on;
        client_max_body_size 1K;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root __TEST_SITE__;
        cgi_ext .py;
        cgi_path __PYTHON_CGI_PATH__;
    }

    location /broken-cgi {
        allow_methods GET;
        root __TEST_SITE__;
        cgi_ext .py;
        cgi_path /definitely/missing/python3;
    }

    location /nested {
        allow_methods GET;
        root __TEST_SITE__;
        autoindex off;
    }

    location /nested/deeper {
        allow_methods GET DELETE;
        root __TEST_SITE__;
        autoindex off;
    }

    # Exercises the optional location-level path override directive.
    location /unused-path {
        path /path-override;
        allow_methods GET;
        root __TEST_SITE__;
        autoindex off;
    }

    location /trailing-root {
        allow_methods GET;
        root __TEST_SITE__/;
        autoindex off;
    }

    location /no-root {
        allow_methods GET;
    }

    location /redirect-301 {
        return 301 /;
    }

    location /redirect-302 {
        return 302 /assets/test.txt;
    }

    location /redirect-303 {
        return 303 /get-only/page.html;
    }

    location /redirect-307 {
        return 307 /upload/;
    }

    location /redirect-308 {
        return 308 /;
    }
}

# Name-based virtual host sharing the 8080 listener.
server {
    listen 127.0.0.1:8080;
    server_name vhost.local alias.local;
    client_max_body_size 8K;

    error_page 404 /errors/404.html;

    location / {
        allow_methods GET;
        root __TEST_SITE__/vhost;
        index index.html;
        autoindex off;
    }
}

# Independent listener verifies multi-server operation.
server {
    listen 127.0.0.1:9090;
    server_name second.local;
    client_max_body_size 4K;

    error_page 404 /errors/404.html;

    location / {
        allow_methods GET;
        root __TEST_SITE__/secondary;
        index index.html;
        autoindex off;
    }
}
