server {
    listen 127.0.0.1:8080;
    client_max_body_size 100000000;

    location / {
        allow_methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
    }

    location /directory/ {
        allow_methods GET POST;
        root ./YoupiBanane;
        index youpi.bad_extension;
        autoindex off;
        cgi_ext .bla;
        cgi_path ./cgi_tester;
    }

    location /post_body {
        allow_methods POST;
        root .;
        upload_enable on;
        upload_store ./post_body;
        client_max_body_size 100;
    }
}
